services:
  redis_container: 
    image: redis:latest
    container_name: redis-container
    restart: always
    network_mode: "service:localhost"


  mongodb_container:
    image: mongo:latest
    container_name: mongo-container
    volumes:
      - ./imageConfigs/mongo/init.sh:/etc/mongo/custom_init.sh
      - ./imageConfigs/mongo/createUser.js:/createUser.js
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    entrypoint: /etc/mongo/custom_init.sh
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0', members:[{_id:0,host:'localhost:27017'}]}) }" | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 30s
      start_period: 0s
      start_interval: 1s
      retries: 30
    network_mode: "service:localhost"


  rabbitmq_container: 
    image: rabbitmq:management
    container_name: rabbitmq-container
    volumes:
    - ./imageConfigs/rabbitMQ/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    - ./imageConfigs/rabbitMQ/definitions.json:/etc/rabbitmq/definitions.json:ro
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    post_start:
      - command: "rabbitmq-plugins enable rabbitmq_stomp"
    network_mode: "service:localhost"
    

  keycloak_container:
    image: keycloak/keycloak:latest
    container_name: keycloak-container
    volumes:
      - ./imageConfigs/keycloak/import:/opt/keycloak/data/import
    restart: always
    environment:       
      KEYCLOAK_IMPORT: /opt/keycloak/data/import/realm-export.json
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    command: start-dev --import-realm --http-port=9090
    network_mode: "service:localhost"


  minio_container:
    image: quay.io/minio/aistor/minio:latest
    container_name: minio-container
    restart: always
    volumes:
        - ./imageConfigs/minIO/minio.license:/minio.license:ro
    command: server /data --license /minio.license
    network_mode: "service:localhost"

# ===============================================================================

  localhost:
    image: alpine:latest
    command: sleep infinity
    ports:
    # Keycloak port
    - "9090:9090" 
    # app
    - "8080:8080" 
    - "8081:8081" 
    - "8082:8082" 
    - "8083:8083" 
    - "8084:8084" 
    - "8761:8761"
    # minio
    - "9000:9000"
    - "9001:9001"
    # rabbit
    - "61613:61613"     
    - "5672:5672"       
    - "15672:15672"
    # redis
    - "6379:6379"
    # mongodb
    - "27017:27017"


# =============================================================================== 

  registry_service_container:
    build: ./registry-service
    container_name: registry-service-container
    restart: always
    network_mode: "service:localhost"


  api_gateway_container:
    build: ./api-gateway
    container_name: api-gateway-container
    restart: always
    network_mode: "service:localhost"


  microservice_charactersheet_container:
    build: ./microservice-characterSheet
    container_name: microservice-charactersheet-container
    restart: always
    network_mode: "service:localhost"


  microservice_image_container:
    build: ./microservice-image
    container_name: microservice-image-container
    restart: always
    network_mode: "service:localhost"


  microservice_user_container:
    build: ./microservice-user
    container_name: microservice-user-container
    restart: always
    network_mode: "service:localhost"


  microservice_lobby_container:
    build: ./microservice-lobby
    container_name: microservice-lobby-container
    restart: always
    network_mode: "service:localhost"