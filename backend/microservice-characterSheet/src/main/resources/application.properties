spring.application.name=microservice-characterSheet

server.port=${PORT:0}

# Security
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://${KEYCLOAK_HOST:127.0.0.1}:9090/realms/dndservice-users-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://${KEYCLOAK_HOST:127.0.0.1}:9090/realms/dndservice-users-realm/protocol/openid-connect/certs

# Redis
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=0

# MongoDB
spring.mongodb.host=${MONGODB_HOST:127.0.0.1}
spring.mongodb.port=${MONGODB_PORT:27017}
spring.mongodb.authentication-database=${DB_AUTH:admin}
spring.mongodb.username=${DB_USERNAME:admin}
spring.mongodb.password=${DB_PASSWORD:admin}
spring.mongodb.protocol=mongodb
spring.mongodb.replica-set-name=${MONGODB_REPLICA:rs0}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# app specific custom properties
rabbitmq.bind.key.image=queue.image.removed
rabbitmq.exchange.image=ImagesRemoved

rabbitmq.bind.key.user=queue.user.removed
rabbitmq.exchange.user=UsersRemoved

rabbitmq.queue.charSheet.user=CharSheetsMicro.user
rabbitmq.queue.charSheet.image=CharSheetsMicro.image

app.user.max.characterSheets=10
