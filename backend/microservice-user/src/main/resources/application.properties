spring.application.name=microservice-user

server.port=0

# Keycloak admin client
keycloak.baseUrl=http://127.0.0.1:9090/
keycloak.realm=dndservice-users-realm
keycloak.credentials.clientId=dndservice-keycloak-admin-id
keycloak.credentials.clientSecret=admin
keycloak.playground.realm=dndservice-users-realm

keycloak.users.clientId=dndservice-keycloak-id

# Security
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://127.0.0.1:9090/realms/dndservice-users-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://127.0.0.1:9090/realms/dndservice-users-realm/protocol/openid-connect/certs

# Rabbit MQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# app properties
rabbitmq.bind.key.user=queue.user.removed
rabbitmq.exchange.user=UsersRemoved