spring.application.name=microservice-user

server.port=${PORT:0}

# Keycloak admin client
keycloak.baseUrl=http://${KEYCLOAK_HOST:127.0.0.1}:9090/
keycloak.realm=dndservice-users-realm
keycloak.credentials.clientId=dndservice-keycloak-admin-id
keycloak.credentials.clientSecret=admin
keycloak.playground.realm=dndservice-users-realm

# Security
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://${KEYCLOAK_HOST:127.0.0.1}:9090/realms/dndservice-users-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://${KEYCLOAK_HOST:127.0.0.1}:9090/realms/dndservice-users-realm/protocol/openid-connect/certs

# Rabbit MQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# app properties
rabbitmq.bind.key.user=queue.user.removed
rabbitmq.exchange.user=UsersRemoved