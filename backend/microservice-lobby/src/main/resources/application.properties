spring.application.name=microservice-lobby

server.port=0

org.springframework.security.messaging.web.socket=DEBUG
org.springframework.web.socket.server=DEBUG

# Security OAuth2
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://127.0.0.1:9090/realms/dndservice-users-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://127.0.0.1:9090/realms/dndservice-users-realm/protocol/openid-connect/certs

# MongoDB
spring.mongodb.host=${MONGODB_HOST:127.0.0.1}
spring.mongodb.port=${MONGODB_PORT:27017}
spring.mongodb.authentication-database=${DB_AUTH}
spring.mongodb.username=${DB_USERNAME}
spring.mongodb.password=${DB_PASSWORD}
spring.mongodb.protocol=mongodb
spring.mongodb.replica-set-name=${MONGODB_REPLICA:rs0}

# Redis
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=0

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:127.0.0.1}

rabbitmq.port.ws=${RABBITMQ_PORT_WS:61613}
rabbitmq.port.mb=${RABBITMQ_PORT:5672}

spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

rabbitmq.bind.key.image=queue.image.removed
rabbitmq.exchange.image=ImagesRemoved

rabbitmq.bind.key.user=queue.user.removed
rabbitmq.exchange.user=UsersRemoved

rabbitmq.queue.lobby.user=LobbiesMicro.user
rabbitmq.queue.lobby.image=LobbiesMicro.image

# app specific properties
app.user.max.boards=3
app.lobby.board.max.pieces=30
app.lobby.max.users=10
app.lobby.timeoutInHours=6

app.lobby.message.unregistered=event:lobby_closed:unregistered
app.lobby.message.timeout=event:lobby_closed:timeout
