# Eureka config
eureka:
  instance.instance-id: ${spring.application.name}:${random.uuid}
  client.service-url:
      defaultZone: "http://${REGISTRY_HOST:127.0.0.1}:8761/eureka/"
# Redis properties
spring.data.redis.host: ${REDIS_HOST:127.0.0.1}
spring.data.redis.port: ${REDIS_PORT:6379}

# App Custom Config
rateLimit.bucket.capacity: 50
rateLimit.bucket.refillTokens: 1
rateLimit.bucket.refillPeriod: 2s
rateLimit.bucket.requestedTokens: 1

server:
  port: 8080

# Logging
logging:
  level:
    reactor:
      netty: DEBUG
    org:
      springframework:
        cloud:
          gateway: DEBUG
        web:
          reactive: DEBUG
        http:
          server:
            reactive: DEBUG

spring:
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: http://${KEYCLOAK_HOST:127.0.0.1}:9090/realms/dndservice-users-realm
        registration:
          keycloak:
            provider: keycloak
            client-id: dndservice-keycloak-id
            client-secret: admin
            authorization-grant-type: authorization_code
            redirect-uri: http://127.0.0.1:8080/login/oauth2/code/keycloak
            scope:
              - openid
              - profile
              - email
              - offline_access
  application:
    name:
      api-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
          routes:
# USER rest service ====================================================================================
            - id: microservice-user
              uri: lb://MICROSERVICE-USER
              filters:
                - name: RequestRateLimiter
                  args:
                    bucket4j-rate-limiter.capacity: ${rateLimit.bucket.capacity}
                    bucket4j-rate-limiter.refillTokens: ${rateLimit.bucket.refillTokens}
                    bucket4j-rate-limiter.refillPeriod: ${rateLimit.bucket.refillPeriod}
                    bucket4j-rate-limiter.requestedTokens: ${rateLimit.bucket.requestedTokens}
                - TokenRelay=
                - SaveSession
              predicates:
              - Path=/api/v1/users/**
# CHARACTER SHEET rest service ====================================================================================
            - id: microservice-characterSheet
              uri: lb://MICROSERVICE-CHARACTERSHEET
              filters:
                - name: RequestRateLimiter
                  args:
                    bucket4j-rate-limiter.capacity: ${rateLimit.bucket.capacity}
                    bucket4j-rate-limiter.refillTokens: ${rateLimit.bucket.refillTokens}
                    bucket4j-rate-limiter.refillPeriod: ${rateLimit.bucket.refillPeriod}
                    bucket4j-rate-limiter.requestedTokens: ${rateLimit.bucket.requestedTokens}
                - TokenRelay=
                - SaveSession
              predicates:
              - Path=/api/v1/charSheets/**
# IMAGE rest service ====================================================================================
            - id: microservice-image
              uri: lb://MICROSERVICE-IMAGE
              filters:
                - name: RequestRateLimiter
                  args:
                    bucket4j-rate-limiter.capacity: ${rateLimit.bucket.capacity}
                    bucket4j-rate-limiter.refillTokens: ${rateLimit.bucket.refillTokens}
                    bucket4j-rate-limiter.refillPeriod: ${rateLimit.bucket.refillPeriod}
                    bucket4j-rate-limiter.requestedTokens: ${rateLimit.bucket.requestedTokens}
                - TokenRelay=
                - SaveSession
              predicates:
              - Path=/api/v1/images/**
# LOBBY rest service ====================================================================================
            - id: microservice-lobby-rs
              uri: lb://MICROSERVICE-LOBBY
              filters:
                - name: RequestRateLimiter
                  args:
                    bucket4j-rate-limiter.capacity: ${rateLimit.bucket.capacity}
                    bucket4j-rate-limiter.refillTokens: ${rateLimit.bucket.refillTokens}
                    bucket4j-rate-limiter.refillPeriod: ${rateLimit.bucket.refillPeriod}
                    bucket4j-rate-limiter.requestedTokens: ${rateLimit.bucket.requestedTokens}
                - TokenRelay=
                - SaveSession
              predicates:
              - Path=/api/v1/lobbies/**
# LOBBY websocket service ====================================================================================
            - id: microservice-lobby-ws
              uri: lb:ws://MICROSERVICE-LOBBY
              filters:
                - name: RequestRateLimiter
                  args:
                    bucket4j-rate-limiter.capacity: ${rateLimit.bucket.capacity}
                    bucket4j-rate-limiter.refillTokens: ${rateLimit.bucket.refillTokens}
                    bucket4j-rate-limiter.refillPeriod: ${rateLimit.bucket.refillPeriod}
                    bucket4j-rate-limiter.requestedTokens: ${rateLimit.bucket.requestedTokens}
                - TokenRelay=
                - SaveSession
              predicates:
                - Path=/websock/**
# IMAGE sockJs service ====================================================================================
            - id: microservice-lobby-sockJs
              uri: lb://MICROSERVICE-LOBBY
              filters:
                - name: RequestRateLimiter
                  args:
                    bucket4j-rate-limiter.capacity: ${rateLimit.bucket.capacity}
                    bucket4j-rate-limiter.refillTokens: ${rateLimit.bucket.refillTokens}
                    bucket4j-rate-limiter.refillPeriod: ${rateLimit.bucket.refillPeriod}
                    bucket4j-rate-limiter.requestedTokens: ${rateLimit.bucket.requestedTokens}
                - TokenRelay=
                - SaveSession
              predicates:
              - Path=/websock/info/**
