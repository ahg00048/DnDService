# Mongodb
spring.mongodb:
  database: "dndservice_db_image"
  replica-set-name:
# MinIO
minio.bucket.name: "images"
# RabbitMQ
spring.rabbitmq.virtual-host: "vMicroservicesMQ"
# Eureka config
eureka:
  instance.instance-id: "${spring.application.name}:${random.uuid}"
  client.service-url:
    defaultZone: "http://${REGISTRY_HOST:127.0.0.1}:8761/eureka/"
