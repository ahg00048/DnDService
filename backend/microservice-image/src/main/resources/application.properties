spring.application.name=microservice-image

server.port=${PORT:0}

# Security OAuth2
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://${KEYCLOAK_HOST:localhost}:9090/realms/dndservice-users-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://${KEYCLOAK_HOST:localhost}:9090/realms/dndservice-users-realm/protocol/openid-connect/certs

# MongoDB
spring.mongodb.host=${MONGODB_HOST:localhost}
spring.mongodb.port=${MONGODB_PORT:27017}
spring.mongodb.authentication-database=${DB_AUTH:admin}
spring.mongodb.username=${DB_USERNAME:admin}
spring.mongodb.password=${DB_PASSWORD:admin}
spring.mongodb.protocol=mongodb
spring.mongodb.replica-set-name=${MONGODB_REPLICA:rs0}

# Redis - distb. locks
spring.data.redis.database=1
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# MinIO
minio.hostname=${MINIO_HOST:localhost}
minio.port=${MINIO_PORT:9000}
minio.secure=${MINIO_SECURE:false}
minio.access-key=${MINIO_ACCESS:minioadmin}
minio.secret-key=${MINIO_SECRET:minioadmin}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# app specific custom properties
# Send
rabbitmq.bind.key.image=queue.image.removed
rabbitmq.exchange.image=ImagesRemoved

# Receive
rabbitmq.bind.key.user=queue.user.removed
rabbitmq.exchange.user=UsersRemoved
rabbitmq.queue.image=ImagesMicro.user


app.user.max.images=20
app.image.max.sizeInKB=300
